name: Regenerate Xcode project

# project.yml(XcodeGen 소스)이 바뀌면 macOS 러너에서 `xcodegen generate` 를 실행해
# 저장소에 커밋된 BikeCom.xcodeproj 를 최신 상태로 갱신한다.
# 이렇게 하면 이 저장소를 pull 받는 사람은 xcodegen 을 설치하지 않고도
# `open BikeCom.xcodeproj` 로 바로 빌드할 수 있다.
on:
  push:
    paths:
      - project.yml
      # project.yml 뿐 아니라 소스 트리(BikeCom/** 등)가 바뀔 때도(파일 추가·삭제 포함) 돌려야
      # 한다 — project.pbxproj는 `xcodegen generate` 시점의 스냅샷이라, project.yml 은 안
      # 건드리고 .swift 파일만 지워도(예: LegacyRideImporter.swift 삭제) pbxproj엔 그 파일이
      # 빌드 입력으로 여전히 남아 "Build input file cannot be found" 로 빌드가 깨진다.
      - BikeCom/**
      - BikeComWatch/**
      - BikeComShared/**
      - BikeComWatchWidget/**
  workflow_dispatch: {}

permissions:
  contents: write

jobs:
  xcodegen:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install XcodeGen
        run: brew install xcodegen

      - name: Generate Xcode project
        run: xcodegen generate

      - name: Commit regenerated project (if changed)
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          # xcodegen 은 project.pbxproj 뿐 아니라 각 타깃의 info.path 에 있는 Info.plist도
          # 다시 쓴다 — 전에는 BikeCom.xcodeproj만 커밋해서, project.yml의 info.properties를
          # 고쳐도(예: NSAppleMusicUsageDescription 추가) 실제 Info.plist엔 반영되지 않고
          # 조용히 유실됐다(런타임에 "Info.plist must contain an NS...UsageDescription key"로
          # 크래시하는 식으로만 드러남). 생성되는 모든 Info.plist를 같이 커밋한다.
          git add BikeCom.xcodeproj BikeCom/App/Info.plist BikeComWatch/Info.plist BikeComWatchWidget/Info.plist
          if git diff --cached --quiet; then
            echo "변경 없음"
          else
            git commit -m "chore: regenerate BikeCom.xcodeproj + Info.plist via xcodegen [skip ci]"
            git push origin HEAD:"${GITHUB_REF_NAME}"
          fi
